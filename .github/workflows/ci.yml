name: SDK CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.python_arch }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        python_arch: [x64, arm64]
        exclude:
          - os: ubuntu-latest
            python_arch: arm64
          - os: ubuntu-24.04-arm
            python_arch: x64
          - os: windows-latest
            python_arch: arm64
          - os: windows-11-arm
            python_arch: x64
          - os: windows-11-arm
            python_arch: arm64
            python-version: '3.10'
        include:
          # Windows ARM64 has no native CPython 3.10 distribution. Keep the
          # 3.10 support check on the ARM64 runner through x64 emulation.
          - os: windows-11-arm
            python-version: '3.10'
            python_arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python_arch }}
      - name: Report runner and interpreter architecture
        shell: bash
        run: |
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          python - <<'PY'
          import platform
          import struct
          import sys

          print(f"python={sys.version}")
          print(f"machine={platform.machine()}")
          print(f"pointer_bits={struct.calcsize('P') * 8}")
          PY
      - name: Install candidate and build tools
        run: python -m pip install . build wheel "setuptools>=68" mypy
      - name: Check typed SDK consumer compatibility
        run: python -m mypy --python-version 3.10 --follow-imports=silent --warn-unused-ignores tests/typing/orchestrator_consumer.py tests/typing/capability_consumer.py tests/typing/reliability_consumer.py tests/typing/application_consumer.py
      - name: Run SDK tests, source rebuild and isolated wheel consumers
        run: python -m unittest discover -s tests -v
      - name: Check documentation and README examples
        run: python scripts/check_docs.py
      - name: Run portable examples
        run: |
          python examples/managed_task.py
          python examples/local_restore.py
          python examples/kernel_task.py
          python examples/capability_diagnostics.py
          python examples/projection_consumer.py
          python examples/dependent_tasks.py
          python examples/effect_recovery.py
          python examples/durable_audit.py
          python examples/request_result_receipts.py
          python examples/reliability_diagnostics.py
      - name: Run script notification example
        run: python examples/sdk_script_wakeup.py
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo" zricethezav/gitleaks:v8.27.2 git /repo --redact --no-banner
